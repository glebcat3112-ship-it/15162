<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#e9f2f9">
<title>Зимний дровосек</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@700;800&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>
/* Layout: full-bleed canvas world, HUD pills in the two top corners (clear of the Dynamic Island), floating thumb joystick. */
:root{
  --snow:#e9f2f9;
  --snow-deep:#c9dcea;
  --pine:#3b86a8;
  --dirt:#e8b596;
  --wood:#b07a4a;
  --wood-dark:#7a4f2c;
  --ember:#f08a24;
  --lime:#79d23c;
  --lime-dark:#3f8f1c;
  --ink:#1d3447;
  --folk:#34b8c8;
  --banner:#cf3b30;
  --glass:rgba(22,42,64,.62);
  --outline:0 3px 0 #1d3447,2px 2px 0 #1d3447,-2px 2px 0 #1d3447,2px -2px 0 #1d3447,-2px -2px 0 #1d3447,0 -2px 0 #1d3447,2px 0 0 #1d3447,-2px 0 0 #1d3447;
  --font-display:'Rubik','Arial Black',system-ui,sans-serif;
  --font-body:'Nunito',system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{
  margin:0;background:var(--snow);color:var(--ink);font-family:var(--font-body);
  overflow:hidden;overscroll-behavior:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;
}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

.hud{position:fixed;inset:0;z-index:5;pointer-events:none}
.top{
  position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;
  padding-top:calc(env(safe-area-inset-top,0px) + 10px);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.stack{display:flex;flex-direction:column;gap:6px;min-width:0}
.stack.right{align-items:flex-end}
.pill{
  display:flex;align-items:center;gap:8px;min-width:88px;box-sizing:border-box;
  background:var(--glass);color:#fff;font:800 20px/1 var(--font-display);
  padding:7px 12px 7px 9px;border-radius:12px;
}
.pill b{font-weight:800;font-variant-numeric:tabular-nums;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.pill svg{flex:none}
.pill.sm{font:800 14px/1 var(--font-body);min-width:0;gap:6px;padding:7px 10px}
.pill.sm b{font:800 16px/1 var(--font-display)}
.hpbar{width:116px;height:12px;background:var(--glass);border-radius:6px;overflow:hidden}
.hpbar i{display:block;height:100%;width:100%;background:linear-gradient(#ff7a5c,#e0452c);transition:width .15s}
.snd{pointer-events:auto;border:0;cursor:pointer;color:#fff;background:var(--glass);font:800 13px/1 var(--font-body);padding:8px 10px;border-radius:10px}
.snd:focus-visible,.btn:focus-visible{outline:3px solid #fff;outline-offset:3px}
.hint{
  position:absolute;left:50%;transform:translateX(-50%);max-width:calc(100% - 32px);width:max-content;box-sizing:border-box;
  top:calc(env(safe-area-inset-top,0px) + 66px);text-align:center;text-wrap:balance;
  background:var(--glass);color:#fff;font:800 14px/1.25 var(--font-body);padding:8px 14px;border-radius:12px;
}
.toast{
  position:fixed;left:50%;top:27%;z-index:8;transform:translate(-50%,0);opacity:0;pointer-events:none;
  max-width:calc(100% - 32px);text-align:center;white-space:pre-line;text-wrap:balance;
  font:800 clamp(26px,8vw,40px)/1.08 var(--font-display);color:#fff;text-shadow:var(--outline);
}
.toast.show{animation:pop 2.3s ease-out forwards}
@keyframes pop{
  0%{opacity:0;transform:translate(-50%,12px) scale(.6)}
  12%{opacity:1;transform:translate(-50%,0) scale(1.08)}
  20%{transform:translate(-50%,0) scale(1)}
  80%{opacity:1;transform:translate(-50%,0) scale(1)}
  100%{opacity:0;transform:translate(-50%,-16px) scale(1)}
}

.start{
  position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;
  box-sizing:border-box;
  padding-top:calc(env(safe-area-inset-top,0px) + 24px);
  padding-bottom:calc(env(safe-area-inset-bottom,0px) + 24px);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  background:linear-gradient(rgba(233,242,249,.1),rgba(233,242,249,.78) 72%);
}
.start[hidden]{display:none}
.title{margin:0;font:800 clamp(40px,13vw,64px)/.95 var(--font-display);color:#fff;text-shadow:var(--outline);letter-spacing:.01em}
.title span{display:block;color:#ffd23f}
.lead{margin:0;max-width:30ch;font:800 17px/1.35 var(--font-body);color:var(--ink);text-wrap:balance}
.how{list-style:none;margin:0;padding:12px 16px;display:flex;flex-direction:column;gap:8px;text-align:left;background:var(--glass);color:#fff;border-radius:14px;max-width:340px;box-sizing:border-box;font:700 14px/1.3 var(--font-body)}
.how li{position:relative;padding-left:16px}
.how li::before{content:"";position:absolute;left:0;top:.45em;width:7px;height:7px;background:var(--ember);border-radius:2px}
.actions{display:flex;flex-direction:column;align-items:center;gap:12px}
.btn{
  border:0;cursor:pointer;background:var(--lime);color:#fff;border-radius:14px;padding:14px 48px;
  font:800 24px/1 var(--font-display);text-shadow:0 2px 0 rgba(0,0,0,.3);box-shadow:0 5px 0 var(--lime-dark);
}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--lime-dark)}
.btn.ghost{background:transparent;color:var(--ink);text-shadow:none;box-shadow:none;font:800 15px/1 var(--font-body);padding:8px 14px;text-decoration:underline}
@media (prefers-reduced-motion:reduce){.toast.show{animation-duration:2.3s;animation-name:fade}@keyframes fade{0%{opacity:0}10%,80%{opacity:1}100%{opacity:0}}}
</style>
</head>
<body>


<canvas id="c" aria-label="Игровое поле"></canvas>

<div class="hud" id="hud" hidden>
  <div class="top">
    <div class="stack">
      <div class="pill sm">Жители <b id="folk">2</b></div>
      <button class="snd" id="snd" type="button">Звук: вкл</button>
    </div>
    <div class="stack right">
      <div class="pill" aria-label="Дерево">
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><rect x="2" y="7" width="18" height="11" rx="5.5" fill="#b07a4a"/><ellipse cx="18" cy="12.5" rx="4" ry="5.5" fill="#e3b887" stroke="#7a4f2c" stroke-width="1.5"/><circle cx="18" cy="12.5" r="1.6" fill="none" stroke="#7a4f2c"/></svg>
        <b id="wood">0</b>
      </div>
      <div class="pill" aria-label="Мясо">
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M4 11c1-5 9-7 14-3s3 9-2 10-10 0-12-7z" fill="#d9483b"/><path d="M7 11c1-3 5-4 8-2" stroke="#f0786a" stroke-width="2" fill="none" stroke-linecap="round"/><circle cx="18.5" cy="6.5" r="2.4" fill="#fff4e6"/></svg>
        <b id="meat">0</b>
      </div>
      <div class="pill" aria-label="Топоры">
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><rect x="10.8" y="2" width="2.6" height="20" rx="1.3" fill="#8a5a33" transform="rotate(35 12 12)"/><path d="M3 7c4-3.5 9-3 11 0l-3 5c-3 1-6-1-8-5z" fill="#dfe9f1" stroke="#51677a" stroke-width="1.2"/></svg>
        <b id="axes">1</b>
      </div>
    </div>
  </div>
  <div class="hint" id="hint">Руби деревья</div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<div class="start" id="start">
  <h1 class="title">Зимний<span>дровосек</span></h1>
  <p class="lead">Руби ёлки, строй лагерь и корми жителей мясом медведей.</p>
  <ul class="how">
    <li>Веди пальцем по экрану, топоры крутятся вокруг тебя</li>
    <li>Дерево неси на стройку, мясо в котёл</li>
    <li>Сытые жители дают новые топоры</li>
  </ul>
  <div class="actions">
    <button class="btn" id="play" type="button">Играть</button>
    <button class="btn ghost" id="fresh" type="button" hidden>Начать заново</button>
  </div>
</div>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const cv = $('c'), ctx = cv.getContext('2d');
const TAU = Math.PI * 2;
const WORLD = 3200, CX = WORLD / 2, CY = WORLD / 2, CAMP_R = 235;
const KITCHEN = { x: CX, y: CY + 14 };
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rand = (a, b) => a + Math.random() * (b - a);
const eob = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const rng = (seed => () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; })(20261024);

const C = {
  snow: '#e9f2f9', ink: '#1d3447', wood: '#b07a4a', woodDark: '#7a4f2c', woodLight: '#e3b887',
  lime: '#79d23c', ember: '#f08a24', folk: '#34b8c8', banner: '#cf3b30', meatRed: '#d9483b'
};

/* ---------- state ---------- */
const S = { wood: 0, meat: 0, level: 0, fed: 0, hp: 100, hurtT: 0, lastHurt: -9 };
let mode = 'menu', time = 0, playT = 0, shake = 0, flash = 0, axAng = 0;
let W = 0, H = 0, dpr = 1, zoom = 1;
const P = { x: CX + 70, y: CY + 120, vx: 0, vy: 0, kx: 0, ky: 0, face: 1, walk: 0, moving: false };
const cam = { x: P.x, y: P.y };
let trees = [], bears = [], residents = [], pickups = [], flyers = [], parts = [], floats = [], builds = [];
const flakes = [], drifts = [], axes = [];
const tgrid = new Map(), CELL = 160;
let buildTick = 0, kitchenTick = 0, hintT = 0, saveT = 0;
let hintInfo = { text: 'Руби деревья', target: null };

const HOUSE_COST = [12, 25, 40, 60, 90], FENCE_COST = [8, 15, 25, 35, 50];

/* ---------- audio ---------- */
let AC = null, muted = false;
const lastSnd = {};
function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; }
}
function tone(f, d, type, v, slide, key) {
  if (!AC || muted) return;
  const now = AC.currentTime;
  if (key) { if (now - (lastSnd[key] || 0) < 0.05) return; lastSnd[key] = now; }
  try {
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(f, now);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, f + slide), now + d);
    g.gain.setValueAtTime(v || 0.05, now);
    g.gain.exponentialRampToValueAtTime(0.0001, now + d);
    o.connect(g); g.connect(AC.destination);
    o.start(now); o.stop(now + d + 0.03);
  } catch (e) { /* audio is optional */ }
}
const sfx = {
  chop: () => tone(200 + Math.random() * 50, .08, 'triangle', .07, -90, 'chop'),
  fell: () => { tone(120, .25, 'triangle', .09, -60, 'fell'); },
  pick: () => tone(700 + Math.random() * 160, .06, 'sine', .04, 220, 'pick'),
  hurt: () => tone(150, .22, 'sawtooth', .07, -80, 'hurt'),
  bear: () => tone(110, .18, 'sawtooth', .06, -40, 'bear'),
  give: () => tone(420 + Math.random() * 60, .05, 'square', .03, 80, 'give'),
  built: () => { [392, 523, 659].forEach((f, i) => setTimeout(() => tone(f, .14, 'triangle', .07), i * 80)); },
  up: () => { [523, 659, 784, 1046, 1318].forEach((f, i) => setTimeout(() => tone(f, .18, 'triangle', .08), i * 90)); }
};

/* ---------- save ---------- */
const KEY = 'zimniy-drovosek-v1';
function save() {
  try {
    localStorage.setItem(KEY, JSON.stringify({ w: S.wood, m: S.meat, l: S.level, f: S.fed, b: builds.map(b => [b.p, b.done ? 1 : 0]) }));
  } catch (e) { /* storage may be unavailable */ }
}
function readSave() {
  try { return JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { return null; }
}
function clearSave() { try { localStorage.removeItem(KEY); } catch (e) { /* ignore */ } }

/* ---------- world setup ---------- */
function makeBuilds() {
  builds = [];
  for (let i = 0; i < 5; i++) {
    const ah = (-90 + 72 * i) * Math.PI / 180;
    builds.push({ kind: 'house', i, cost: HOUSE_COST[i], p: 0, done: false, pop: 0, x: CX + Math.cos(ah) * 150, y: CY + Math.sin(ah) * 150 });
    const af = (-54 + 72 * i) * Math.PI / 180;
    builds.push({ kind: 'fence', i, cost: FENCE_COST[i], p: 0, done: false, pop: 0, a: af, x: CX + Math.cos(af) * (CAMP_R - 22), y: CY + Math.sin(af) * (CAMP_R - 22) });
  }
}
function makeTrees() {
  trees = []; tgrid.clear();
  for (let i = 0; i < 6000 && trees.length < 280; i++) {
    const x = rng() * (WORLD - 160) + 80, y = rng() * (WORLD - 160) + 80;
    if (Math.hypot(x - CX, y - CY) < CAMP_R + 95) continue;
    const cx = (x / CELL) | 0, cy = (y / CELL) | 0;
    let ok = true;
    for (let a = -1; a <= 1 && ok; a++) for (let b = -1; b <= 1; b++) {
      const l = tgrid.get((cx + a) * 64 + cy + b);
      if (l) for (const t of l) { if ((t.x - x) ** 2 + (t.y - y) ** 2 < 4096) { ok = false; break; } }
    }
    if (!ok) continue;
    const t = { x, y, s: .9 + rng() * .35, hp: 30, max: 30, alive: true, regen: 0, shake: 0, hitCd: 0, fall: 0, dir: rng() < .5 ? -1 : 1 };
    trees.push(t);
    const k = cx * 64 + cy;
    let l = tgrid.get(k); if (!l) { l = []; tgrid.set(k, l); }
    l.push(t);
  }
}
function makeDrifts() {
  drifts.length = 0;
  for (let i = 0; i < 800; i++) {
    const rx = 18 + rng() * 55;
    drifts.push({ x: rng() * WORLD, y: rng() * WORLD, rx, ry: rx * .32, light: rng() < .6 });
  }
}
function spawnBear(b) {
  const a = Math.random() * TAU, d = rand(550, 1300);
  b.x = clamp(CX + Math.cos(a) * d, 100, WORLD - 100);
  b.y = clamp(CY + Math.sin(a) * d, 100, WORLD - 100);
  b.hp = b.max = 50; b.alive = true; b.vx = b.vy = b.kx = b.ky = 0;
  b.dirT = 0; b.wx = b.wy = 0; b.atk = 0; b.hitCd = 0; b.flash = 0; b.face = 1; b.respawn = 0; b.chase = false;
}
function makeBears() {
  bears = [];
  for (let i = 0; i < 8; i++) { const b = {}; spawnBear(b); bears.push(b); }
}
function addResidents(n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * TAU, r = rand(50, 150);
    residents.push({ x: CX + Math.cos(a) * r, y: CY + Math.sin(a) * r + 20, tx: 0, ty: 0, hasT: false, wait: rand(.2, 2), hop: 0, face: 1, step: Math.random() * 6 });
  }
}
function resetWorld(useSave) {
  Object.assign(S, { wood: 0, meat: 0, level: 0, fed: 0, hp: 100, hurtT: 0, lastHurt: -9 });
  Object.assign(P, { x: CX + 70, y: CY + 120, vx: 0, vy: 0, kx: 0, ky: 0, face: 1 });
  cam.x = P.x; cam.y = P.y;
  pickups = []; flyers = []; parts = []; floats = []; residents = [];
  makeBuilds(); makeTrees(); makeBears();
  let houses = 0, hasSave = false;
  const j = useSave ? readSave() : null;
  if (j && Array.isArray(j.b) && j.b.length === builds.length) {
    S.wood = j.w | 0; S.meat = j.m | 0; S.level = j.l | 0; S.fed = j.f | 0;
    builds.forEach((b, i) => { b.p = j.b[i][0] | 0; b.done = !!j.b[i][1]; if (b.done) { b.pop = 1; if (b.kind === 'house') houses++; } });
    hasSave = (S.wood + S.meat + S.level + S.fed + builds.reduce((s, b) => s + b.p, 0)) > 0;
  }
  addResidents(2 + houses * 2);
  return hasSave;
}

/* ---------- helpers ---------- */
const axeCount = () => Math.min(16, 2 ** S.level);
const axeSpin = () => 5 * Math.pow(1.16, S.level);
const need = () => Math.max(2, Math.round(residents.length * (1.5 + S.level * .75)));
const activeBuild = () => builds.find(b => !b.done) || null;
const nearBuild = b => Math.hypot(P.x - b.x, P.y - b.y) < 62;

function burst(x, y, n, colors, o) {
  o = o || {};
  for (let i = 0; i < n && parts.length < 420; i++) {
    const a = Math.random() * TAU, sp = rand(o.sp0 || 40, o.sp1 || 140);
    parts.push({
      x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - (o.up || 0), g: o.g === undefined ? 260 : o.g,
      life: 0, max: rand(.35, o.life || .8), kind: o.kind || 'dot', size: rand(o.s0 || 2, o.s1 || 4.5),
      color: colors[(Math.random() * colors.length) | 0], rot: Math.random() * TAU, vr: rand(-8, 8)
    });
  }
}
function floatText(x, y, text, color) { floats.push({ x, y, text, color: color || '#fff', life: 0 }); }
function drop(type, x, y, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * TAU, sp = rand(60, 140);
    pickups.push({ type, x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 40, age: 0, rot: Math.random() * TAU });
  }
}
let toastTimer = 0;
function toast(text) {
  const e = $('toast');
  e.textContent = text;
  e.classList.remove('show'); void e.offsetWidth; e.classList.add('show');
}

/* ---------- game events ---------- */
function hitTree(t, dmg) {
  t.hp -= dmg; t.hitCd = .32; t.shake = .3;
  burst(t.x, t.y - 20, 5, ['#fff', '#cfe6f3', C.woodLight], { kind: 'chip', sp0: 30, sp1: 110, up: 60, s0: 2, s1: 4 });
  sfx.chop();
  if (t.hp <= 0) {
    t.alive = false; t.regen = 0; t.fall = .4;
    drop('wood', t.x, t.y - 6, 3);
    burst(t.x, t.y - 40, 14, ['#fff', '#e4f1fa', '#bcd9ea'], { sp0: 30, sp1: 150, up: 40, g: 120, life: 1.1 });
    sfx.fell();
  }
}
function hitBear(b, dmg) {
  b.hp -= dmg; b.hitCd = .3; b.flash = .15;
  const dx = b.x - P.x, dy = b.y - P.y, d = Math.hypot(dx, dy) || 1;
  b.kx = dx / d * 230; b.ky = dy / d * 230;
  burst(b.x, b.y - 18, 6, ['#fff', '#ffd1c9', '#cfe6f3'], { sp0: 40, sp1: 130, up: 50, s0: 2, s1: 4 });
  sfx.bear();
  if (b.hp <= 0) {
    b.alive = false; b.respawn = 22;
    drop('meat', b.x, b.y - 10, 2 + S.level);
    burst(b.x, b.y - 18, 16, ['#fff', '#e4f1fa', '#d9483b'], { sp0: 40, sp1: 170, up: 60, life: 1 });
    sfx.fell();
  }
}
function hurt(dmg, nx, ny) {
  S.hp -= dmg; S.hurtT = .45; S.lastHurt = time;
  P.kx = nx * 260; P.ky = ny * 260; shake = Math.max(shake, .25);
  sfx.hurt();
  if (S.hp <= 0) die();
}
function die() {
  const lost = Math.floor(S.meat / 2);
  S.meat -= lost; S.hp = 100;
  P.x = CX + 70; P.y = CY + 120; P.vx = P.vy = P.kx = P.ky = 0;
  toast(lost > 0 ? 'Медведь победил\nМяса потеряно: ' + lost : 'Медведь победил');
}
function completeBuild(b) {
  b.done = true; b.pop = 0;
  burst(b.x, b.y - 20, 22, ['#fff', '#ffe08a', C.woodLight, '#cfe6f3'], { sp0: 60, sp1: 190, up: 90, life: 1 });
  sfx.built();
  if (b.kind === 'house') { addResidents(2); toast('Домик построен\nЖителей +2'); }
  else toast('Забор готов');
  if (!activeBuild()) setTimeout(() => toast('Лагерь построен\nКорми жителей'), 2400);
  save();
}
function levelUp() {
  S.level++; S.fed = 0; flash = 1; shake = .5;
  residents.forEach(r => { r.hop = 1; });
  burst(P.x, P.y - 20, 40, ['#ffd23f', '#fff', '#79d23c', '#ff6b8b'], { sp0: 80, sp1: 260, up: 120, life: 1.2, s0: 2.5, s1: 5.5 });
  toast(S.level <= 4 ? 'Жители сыты\nТопоров: ' + axeCount() : 'Жители сыты\nТопоры вращаются быстрее');
  sfx.up(); save();
}

/* ---------- input ---------- */
let jp = null; const jo = { x: 0, y: 0 }, jv = { x: 0, y: 0 }; const JR = 56;
const keys = new Set();
cv.addEventListener('pointerdown', e => {
  if (jp !== null || mode !== 'play') return;
  jp = e.pointerId; jo.x = e.clientX; jo.y = e.clientY; jv.x = jv.y = 0;
  try { cv.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
  initAudio();
});
cv.addEventListener('pointermove', e => {
  if (e.pointerId !== jp) return;
  let dx = e.clientX - jo.x, dy = e.clientY - jo.y;
  const d = Math.hypot(dx, dy);
  if (d > JR) { const k = (d - JR) / d; jo.x += dx * k; jo.y += dy * k; dx = e.clientX - jo.x; dy = e.clientY - jo.y; }
  const m = Math.min(1, Math.hypot(dx, dy) / JR);
  if (m < .1) { jv.x = jv.y = 0; return; }
  const dd = Math.hypot(dx, dy) || 1;
  jv.x = dx / dd * m; jv.y = dy / dd * m;
});
const endPointer = e => { if (e.pointerId === jp) { jp = null; jv.x = jv.y = 0; } };
cv.addEventListener('pointerup', endPointer);
cv.addEventListener('pointercancel', endPointer);
window.addEventListener('keydown', e => { keys.add(e.code); if (e.code.startsWith('Arrow') || e.code === 'Space') e.preventDefault(); });
window.addEventListener('keyup', e => keys.delete(e.code));
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('contextmenu', e => e.preventDefault());

/* ---------- update ---------- */
function update(dt) {
  time += dt; if (mode === 'play') playT += dt;
  shake = Math.max(0, shake - dt * 1.5); flash = Math.max(0, flash - dt * 1.8);
  S.hurtT = Math.max(0, S.hurtT - dt);

  let ix = 0, iy = 0;
  if (mode === 'play') {
    if (jp !== null) { ix = jv.x; iy = jv.y; }
    else {
      ix = (keys.has('KeyD') || keys.has('ArrowRight') ? 1 : 0) - (keys.has('KeyA') || keys.has('ArrowLeft') ? 1 : 0);
      iy = (keys.has('KeyS') || keys.has('ArrowDown') ? 1 : 0) - (keys.has('KeyW') || keys.has('ArrowUp') ? 1 : 0);
      const m = Math.hypot(ix, iy); if (m > 1) { ix /= m; iy /= m; }
    }
  }
  const sp = 175, k = Math.min(1, dt * 14);
  P.vx += (ix * sp - P.vx) * k; P.vy += (iy * sp - P.vy) * k;
  P.kx *= Math.pow(.001, dt); P.ky *= Math.pow(.001, dt);
  P.x = clamp(P.x + (P.vx + P.kx) * dt, 60, WORLD - 60);
  P.y = clamp(P.y + (P.vy + P.ky) * dt, 60, WORLD - 60);
  const spd = Math.hypot(P.vx, P.vy);
  P.moving = spd > 25; if (P.moving) P.walk += spd * dt * .07;
  if (Math.abs(ix) > .25) P.face = ix > 0 ? 1 : -1;
  const ck = Math.min(1, dt * 7);
  cam.x += (P.x - cam.x) * ck; cam.y += (P.y - cam.y) * ck;

  const inCamp = Math.hypot(P.x - CX, P.y - CY) < CAMP_R + 10;
  if (time - S.lastHurt > 3 && S.hp < 100) S.hp = Math.min(100, S.hp + (inCamp ? 25 : 5) * dt);

  /* trees regrow */
  for (const t of trees) {
    t.shake = Math.max(0, t.shake - dt); t.hitCd = Math.max(0, t.hitCd - dt); t.fall = Math.max(0, t.fall - dt);
    if (!t.alive) { t.regen += dt; if (t.regen >= 13) { t.alive = true; t.hp = t.max; } }
  }

  /* axes */
  const n = axeCount(), spin = axeSpin(), orbit = 62 + n * 1.6, dmg = 15 * (1 + .12 * S.level);
  axAng += spin * dt;
  axes.length = n;
  for (let i = 0; i < n; i++) {
    const ang = axAng + i * TAU / n;
    const x = P.x + Math.cos(ang) * orbit, y = P.y - 10 + Math.sin(ang) * orbit;
    axes[i] = { x, y, ang, orbit };
    const cx = (x / CELL) | 0, cy = (y / CELL) | 0;
    for (let a = -1; a <= 1; a++) for (let b = -1; b <= 1; b++) {
      const l = tgrid.get((cx + a) * 64 + cy + b);
      if (!l) continue;
      for (const t of l) {
        if (t.alive && t.hitCd <= 0 && (t.x - x) ** 2 + (t.y - y) ** 2 < 1444) hitTree(t, dmg);
      }
    }
    for (const be of bears) {
      if (be.alive && be.hitCd <= 0 && (be.x - x) ** 2 + (be.y - 14 - y) ** 2 < 1600) hitBear(be, dmg);
    }
  }

  /* bears */
  for (const b of bears) {
    if (!b.alive) { b.respawn -= dt; if (b.respawn <= 0) spawnBear(b); continue; }
    b.hitCd -= dt; b.flash -= dt; b.atk -= dt;
    const dx = P.x - b.x, dy = P.y - b.y, d = Math.hypot(dx, dy) || 1;
    let dirx = 0, diry = 0, bsp = 0;
    {
      b.chase = false; b.dirT -= dt;
      if (b.dirT <= 0) { b.dirT = rand(1.5, 4); const a = Math.random() * TAU, still = Math.random() < .35; b.wx = still ? 0 : Math.cos(a); b.wy = still ? 0 : Math.sin(a); }
      dirx = b.wx; diry = b.wy; bsp = 34;
    }
    const bk = Math.min(1, dt * 6);
    b.vx += (dirx * bsp - b.vx) * bk; b.vy += (diry * bsp - b.vy) * bk;
    b.kx *= Math.pow(.003, dt); b.ky *= Math.pow(.003, dt);
    b.x += (b.vx + b.kx) * dt; b.y += (b.vy + b.ky) * dt;
    const cd = Math.hypot(b.x - CX, b.y - CY) || 1;
    if (cd < CAMP_R + 36) { b.x = CX + (b.x - CX) / cd * (CAMP_R + 36); b.y = CY + (b.y - CY) / cd * (CAMP_R + 36); }
    b.x = clamp(b.x, 60, WORLD - 60); b.y = clamp(b.y, 60, WORLD - 60);
    if (Math.abs(b.vx) > 6) b.face = b.vx > 0 ? 1 : -1;
  }

  /* residents */
  for (const r of residents) {
    r.hop = Math.max(0, r.hop - dt * 2.2);
    if (r.wait > 0) { r.wait -= dt; continue; }
    const dx = r.tx - r.x, dy = r.ty - r.y, d = Math.hypot(dx, dy);
    if (!r.hasT || d < 4) {
      const a = Math.random() * TAU, rr = rand(48, 175);
      r.tx = CX + Math.cos(a) * rr; r.ty = CY + Math.sin(a) * rr + 10; r.hasT = true; r.wait = rand(.5, 2.5); continue;
    }
    r.x += dx / d * 34 * dt; r.y += dy / d * 34 * dt; r.face = dx > 0 ? 1 : -1; r.step += dt * 10;
  }

  /* pickups */
  for (let i = pickups.length - 1; i >= 0; i--) {
    const q = pickups[i]; q.age += dt;
    if (q.age < .4) {
      q.x += q.vx * dt; q.y += q.vy * dt;
      const f = Math.pow(.02, dt); q.vx *= f; q.vy *= f;
    } else {
      const dx = P.x - q.x, dy = P.y - 16 - q.y, d = Math.hypot(dx, dy);
      const m = Math.min(d, (260 + (q.age - .4) * 900) * dt);
      if (d > 0) { q.x += dx / d * m; q.y += dy / d * m; }
      if (d < 18) {
        if (q.type === 'wood') S.wood++; else S.meat++;
        floatText(P.x, P.y - 48, '+1', q.type === 'wood' ? '#ffd9a8' : '#ffb3a8');
        sfx.pick();
        pickups.splice(i, 1);
      }
    }
  }
  for (let i = flyers.length - 1; i >= 0; i--) { flyers[i].t += dt; if (flyers[i].t >= flyers[i].dur) flyers.splice(i, 1); }
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i]; p.life += dt;
    if (p.life >= p.max) { parts.splice(i, 1); continue; }
    p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
  }
  for (let i = floats.length - 1; i >= 0; i--) { floats[i].life += dt; if (floats[i].life > .9) floats.splice(i, 1); }
  for (const b of builds) if (b.done && b.pop < 1) b.pop = Math.min(1, b.pop + dt * 2.2);

  /* building: carry wood to the glowing spot */
  const ab = activeBuild();
  buildTick -= dt;
  if (mode === 'play' && ab && S.wood > 0 && nearBuild(ab) && buildTick <= 0) {
    buildTick = .07;
    const amt = Math.min(S.wood, ab.cost - ab.p, Math.max(1, Math.ceil(ab.cost / 18)));
    S.wood -= amt; ab.p += amt;
    flyers.push({ x0: P.x, y0: P.y - 22, x1: ab.x, y1: ab.y - 20, t: 0, dur: .28, type: 'wood' });
    sfx.give();
    if (ab.p >= ab.cost) completeBuild(ab);
  }
  /* feeding: carry meat to the pot */
  kitchenTick -= dt;
  if (mode === 'play' && S.meat > 0 && Math.hypot(P.x - KITCHEN.x, P.y - KITCHEN.y) < 62 && kitchenTick <= 0) {
    kitchenTick = .12;
    S.meat--; S.fed++;
    flyers.push({ x0: P.x, y0: P.y - 22, x1: KITCHEN.x, y1: KITCHEN.y - 26, t: 0, dur: .28, type: 'meat' });
    const r = residents[(Math.random() * residents.length) | 0];
    if (r) { r.hop = 1; burst(r.x, r.y - 30, 3, ['#ff6b8b'], { kind: 'heart', sp0: 10, sp1: 40, up: 70, g: -20, life: .9, s0: 4, s1: 6 }); }
    sfx.give();
    if (S.fed >= need()) levelUp();
  }

  /* hint */
  hintT -= dt;
  if (hintT <= 0) {
    hintT = .2;
    if (ab && S.wood > 0) hintInfo = { text: 'Отнеси дерево на стройку', target: ab };
    else if (S.meat > 0) hintInfo = { text: 'Отнеси мясо к котлу', target: KITCHEN };
    else if (ab) hintInfo = { text: 'Руби деревья, на стройку нужно ещё ' + (ab.cost - ab.p), target: null };
    else hintInfo = { text: 'Охоться на медведей: мясо кормит жителей', target: null };
  }

  /* weather */
  if (!flakes.length) for (let i = 0; i < 70; i++) flakes.push({ x: Math.random(), y: Math.random(), r: rand(1.2, 3), v: rand(.04, .1), s: rand(0, TAU) });
  for (const f of flakes) { f.y += f.v * dt; f.x += Math.sin(time * .8 + f.s) * .01 * dt; if (f.y > 1.02) { f.y = -0.02; f.x = Math.random(); } }

  saveT -= dt; if (saveT <= 0) { saveT = 5; if (mode === 'play') save(); }
}

/* ---------- drawing helpers ---------- */
function rr(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function fillRR(x, y, w, h, r, c) { rr(x, y, w, h, r); ctx.fillStyle = c; ctx.fill(); }
function ell(x, y, rx, ry, c) { ctx.beginPath(); ctx.ellipse(x, y, Math.max(0.01, rx), Math.max(0.01, ry), 0, 0, TAU); ctx.fillStyle = c; ctx.fill(); }
function poly(pts, c) {
  ctx.beginPath(); ctx.moveTo(pts[0], pts[1]);
  for (let i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]);
  ctx.closePath(); ctx.fillStyle = c; ctx.fill();
}
function label(txt, x, y, size, fill) {
  ctx.font = '800 ' + size + 'px Rubik, system-ui, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  ctx.lineWidth = size * .28; ctx.strokeStyle = C.ink; ctx.strokeText(txt, x, y);
  ctx.fillStyle = fill || '#fff'; ctx.fillText(txt, x, y);
}
function logIcon(x, y, s) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  fillRR(-8, -4, 13, 8, 4, C.wood); ell(5, 0, 3, 4, C.woodLight);
  ctx.restore();
}
function meatIcon(x, y, s) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ell(0, 0, 8, 6, C.meatRed); ell(-2, -1.5, 4, 2.2, '#f0786a'); ell(6, -3, 2.4, 2.4, '#fff4e6');
  ctx.restore();
}
function dashedRR(x, y, w, h, r, color, lw, alpha) {
  ctx.save(); ctx.globalAlpha = alpha; ctx.setLineDash([9, 7]); ctx.lineWidth = lw; ctx.strokeStyle = color;
  rr(x, y, w, h, r); ctx.stroke(); ctx.restore();
}

/* ---------- object drawing ---------- */
function drawPine() {
  const tiers = [[-12, 30, 36, '#3f8fb0'], [-34, 24, 33, '#62aecb'], [-54, 17, 31, '#86c6de']];
  fillRR(-4, -16, 8, 16, 2, '#8b5a33');
  for (const [yb, w, h, col] of tiers) {
    poly([-w, yb, w, yb, 0, yb - h], col);
    const cy = yb - h + h * .5;
    poly([0, yb - h, -w * .5, cy, -w * .25, cy - 4, 0, cy + 3, w * .25, cy - 4, w * .5, cy], '#f4faff');
  }
}
function drawTree(t) {
  const x = t.x, y = t.y;
  const grow = t.alive ? 1 : Math.max(0, Math.min(.98, (t.regen - 5) / 8));
  const sc = t.s * (grow >= 1 ? 1 : eob(grow) * .98);
  if (grow > 0 || t.fall > 0) ell(x + 6, y + 3, 24 * sc, 9 * sc, 'rgba(70,100,130,.22)');
  if (!t.alive) {
    fillRR(x - 7, y - 8, 14, 9, 3, '#a87145'); ell(x, y - 8, 7, 3.2, C.woodLight); ell(x, y - 9.5, 5, 2, '#f4faff');
  }
  if (t.alive || grow > 0.02 || t.fall > 0) {
    ctx.save(); ctx.translate(x, y);
    if (t.fall > 0) { const f = t.fall / .4; ctx.rotate(t.dir * (1 - f) * 1.35); ctx.globalAlpha = f; ctx.scale(t.s, t.s); }
    else {
      ctx.scale(sc, sc);
      if (t.shake > 0) { ctx.translate(Math.sin(time * 55) * 3 * (t.shake / .3), 0); ctx.rotate(Math.sin(time * 48) * .05 * (t.shake / .3)); }
    }
    drawPine(); ctx.restore();
  }
}
function drawBear(b) {

  ctx.lineWidth = 2; ctx.strokeStyle = '#a9c2d4';

  ell(x, y - 17 + wob, 27, 17, fill); ctx.stroke();
  ell(x + f * 23, y - 23 + wob, 12.5, 11.5, fill); ctx.stroke();
  ell(x + f * 17, y - 34 + wob, 4.5, 4.5, fill); ctx.stroke();

  poly([x - 6, y, x, y - 11 - fl, x + 6, y], '#ffd23f');
  ell(x, y - 24, 22, 8, '#2c333b');
  fillRR(x - 22, y - 38, 44, 22, 9, '#3b434c');
  ell(x, y - 37, 22, 8, '#4a535d'); ell(x, y - 37, 17, 5.5, '#a5472f');
  if (Math.random() < .08) parts.push({ x: x + rand(-8, 8), y: y - 44, vx: rand(-6, 6), vy: -36, g: -4, life: 0, max: 1.2, kind: 'dot', size: rand(3, 6), color: 'rgba(255,255,255,.7)', rot: 0, vr: 0 });
}

/* ---------- render ---------- */
const items = [];
function render() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = C.snow; ctx.fillRect(0, 0, W, H);
  const sx = (Math.random() - .5) * shake * 14, sy = (Math.random() - .5) * shake * 14;
  ctx.setTransform(dpr * zoom, 0, 0, dpr * zoom, dpr * (W / 2 - cam.x * zoom + sx), dpr * (H / 2 - cam.y * zoom + sy));
  const hw = W / 2 / zoom, hh = H / 2 / zoom;
  const x0 = cam.x - hw - 90, x1 = cam.x + hw + 90, y0 = cam.y - hh - 110, y1 = cam.y + hh + 90;
  const vis = (x, y) => x > x0 && x < x1 && y > y0 && y < y1;

  for (const d of drifts) if (vis(d.x, d.y)) ell(d.x, d.y, d.rx, d.ry, d.light ? 'rgba(255,255,255,.75)' : 'rgba(170,200,222,.32)');

  /* camp ground */
  ell(CX, CY, CAMP_R + 16, CAMP_R + 16, 'rgba(255,255,255,.95)');
  const g = ctx.createRadialGradient(CX, CY, 20, CX, CY, CAMP_R);
  g.addColorStop(0, '#f1c6aa'); g.addColorStop(1, '#e2a98b');
  ctx.beginPath(); ctx.arc(CX, CY, CAMP_R, 0, TAU); ctx.fillStyle = g; ctx.fill();
  ctx.lineWidth = 6; ctx.strokeStyle = '#d29a7c'; ctx.stroke();

  const ab = activeBuild();
  const pulse = .55 + Math.sin(time * 5) * .25;
  /* fence rails & ghosts */
  for (const b of builds) {
    if (b.kind !== 'fence') continue;
    const a0 = b.a - 36 * Math.PI / 180, a1 = b.a + 36 * Math.PI / 180;
    if (b.done || b.p > 0) {
      const frac = b.done ? 1 : b.p / b.cost;
      ctx.beginPath(); ctx.arc(CX, CY - 11, CAMP_R, a0 + 6 * Math.PI / 180, a0 + 6 * Math.PI / 180 + (a1 - a0 - 12 * Math.PI / 180) * frac);
      ctx.lineWidth = 4; ctx.strokeStyle = '#8f5f38'; ctx.stroke();
    }
    if (!b.done) {
      ctx.save(); ctx.setLineDash([10, 8]); ctx.lineWidth = b === ab ? 5 : 3;
      ctx.strokeStyle = b === ab && nearBuild(b) ? C.lime : '#fff'; ctx.globalAlpha = b === ab ? pulse + .2 : .3;
      ctx.beginPath(); ctx.arc(CX, CY, CAMP_R, a0, a1); ctx.stroke(); ctx.restore();
    }
  }
  /* house plots */
  for (const b of builds) {
    if (b.kind !== 'house' || b.done) continue;
    const act = b === ab;
    ctx.save(); ctx.globalAlpha = act ? .35 : .15; rr(b.x - 42, b.y - 20, 84, 62, 8); ctx.fillStyle = '#fff'; ctx.fill(); ctx.restore();
    dashedRR(b.x - 42, b.y - 20, 84, 62, 8, act && nearBuild(b) ? C.lime : '#fff', act ? 4 : 3, act ? pulse + .3 : .45);
  }
  /* kitchen zone ring */
  ctx.save(); ctx.setLineDash([8, 7]); ctx.lineWidth = 3; ctx.strokeStyle = S.meat > 0 ? C.lime : '#fff';
  ctx.globalAlpha = S.meat > 0 ? pulse + .25 : .4; ctx.beginPath(); ctx.ellipse(KITCHEN.x, KITCHEN.y, 62, 62, 0, 0, TAU); ctx.stroke(); ctx.restore();

  /* depth-sorted entities */
  items.length = 0;
  for (const t of trees) if (vis(t.x, t.y)) items.push({ y: t.y, k: 0, o: t });
  for (const b of bears) if (b.alive && vis(b.x, b.y)) items.push({ y: b.y, k: 1, o: b });
  items.push({ y: P.y, k: 2, o: P });
  for (const r of residents) items.push({ y: r.y, k: 3, o: r });
  items.push({ y: KITCHEN.y + 8, k: 6, o: null });
  for (const a of axes) items.push({ y: a.y, k: 8, o: a });
  for (const b of builds) {
    if (b.kind === 'house' && b.done) items.push({ y: b.y + 22, k: 4, o: b });
    if (b.kind === 'fence') {
      const n = b.done ? 6 : Math.floor(b.p / b.cost * 6);
      for (let i = 0; i < n; i++) {
        const a = b.a + (i - 2.5) * 12 * Math.PI / 180;
        const px = CX + Math.cos(a) * CAMP_R, py = CY + Math.sin(a) * CAMP_R;
        if (vis(px, py)) items.push({ y: py, k: 5, o: { x: px, y: py } });
      }
      if (b.done) items.push({ y: b.y + 1, k: 7, o: b });
    }
  }
  items.sort((p, q) => p.y - q.y);
  for (const it of items) {
    switch (it.k) {
      case 0: drawTree(it.o); break;
      case 1: drawBear(it.o); break;
      case 2: drawPlayer(); break;
      case 3: drawResident(it.o); break;
      case 4: drawHouse(it.o); break;
      case 5: drawPost(it.o.x, it.o.y); break;
      case 6: drawKitchen(); break;
      case 7: drawBanner(it.o); break;
      case 8: drawAxe(it.o); break;
    }
  }

  /* axe trails */
  if (axes.length) {
    const spin = axeSpin(), o = axes[0].orbit;
    ctx.save(); ctx.lineWidth = 7; ctx.lineCap = 'round'; ctx.strokeStyle = 'rgba(255,255,255,.4)';
    for (const a of axes) { ctx.beginPath(); ctx.arc(P.x, P.y - 10, o, a.ang - Math.min(1.1, spin * .09), a.ang - .15); ctx.stroke(); }
    ctx.restore();
  }

  /* pickups */
  for (const q of pickups) {
    const lift = q.age < .4 ? Math.sin(q.age / .4 * Math.PI) * 14 : 0;
    ctx.save(); ctx.translate(q.x, q.y - lift); ctx.rotate(q.rot);
    if (q.type === 'wood') { fillRR(-8, -4, 16, 8, 4, C.wood); ell(6, 0, 3, 4, C.woodLight); }
    else { ell(0, 0, 9, 6.5, C.meatRed); ell(-2, -1.5, 4.5, 2.4, '#f0786a'); ell(7, -3, 2.6, 2.6, '#fff4e6'); }
    ctx.restore();
  }
  for (const f of flyers) {
    const k = f.t / f.dur, e = k * k * (3 - 2 * k);
    const x = f.x0 + (f.x1 - f.x0) * e, y = f.y0 + (f.y1 - f.y0) * e - Math.sin(k * Math.PI) * 26;
    if (f.type === 'wood') logIcon(x, y, 1); else meatIcon(x, y, 1);
  }
  for (const p of parts) {
    const a = 1 - p.life / p.max;
    ctx.globalAlpha = Math.max(0, a);
    if (p.kind === 'chip') { ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillStyle = p.color; ctx.fillRect(-p.size, -p.size * .5, p.size * 2, p.size); ctx.restore(); }
    else if (p.kind === 'heart') {
      const s = p.size; ctx.fillStyle = p.color; ctx.beginPath();
      ctx.moveTo(p.x, p.y + s * .9); ctx.bezierCurveTo(p.x - s * 1.8, p.y - s * .2, p.x - s * .8, p.y - s * 1.5, p.x, p.y - s * .5);
      ctx.bezierCurveTo(p.x + s * .8, p.y - s * 1.5, p.x + s * 1.8, p.y - s * .2, p.x, p.y + s * .9); ctx.fill();
    } else { ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, TAU); ctx.fillStyle = p.color; ctx.fill(); }
    ctx.globalAlpha = 1;
  }

  /* build cost label */
  if (ab) {
    const lx = ab.x, ly = ab.kind === 'house' ? ab.y - 40 : ab.y - 46;
    fillRR(lx - 34, ly - 14, 68, 28, 9, 'rgba(22,42,64,.78)');
    logIcon(lx - 19, ly, 1.1); label(String(ab.cost - ab.p), lx + 8, ly + 1, 17);
    fillRR(lx - 28, ly + 17, 56, 6, 3, 'rgba(22,42,64,.6)');
    fillRR(lx - 28, ly + 17, 56 * (ab.p / ab.cost), 6, 3, C.lime);
  }
  /* kitchen label */
  {
    const lx = KITCHEN.x, ly = KITCHEN.y - 64, nd = need();
    fillRR(lx - 40, ly - 14, 80, 28, 9, 'rgba(22,42,64,.78)');
    meatIcon(lx - 22, ly, 1.1); label(S.fed + '/' + nd, lx + 10, ly + 1, 16);
    fillRR(lx - 32, ly + 17, 64, 6, 3, 'rgba(22,42,64,.6)');
    fillRR(lx - 32, ly + 17, 64 * Math.min(1, S.fed / nd), 6, 3, '#ff8a6b');
  }
  for (const f of floats) { ctx.globalAlpha = 1 - f.life / .9; label(f.text, f.x, f.y - f.life * 30, 18, f.color); ctx.globalAlpha = 1; }

  /* arrow toward the next goal */
  if (mode === 'play' && hintInfo.target) {
    const tx = hintInfo.target.x - P.x, ty = hintInfo.target.y - P.y, td = Math.hypot(tx, ty);
    if (td > 170) {
      const ux = tx / td, uy = ty / td, bob = Math.sin(time * 6) * 5;
      ctx.save(); ctx.translate(P.x + ux * (112 + bob), P.y - 12 + uy * (112 + bob)); ctx.rotate(Math.atan2(uy, ux));
      ctx.beginPath(); ctx.moveTo(15, 0); ctx.lineTo(-9, -11); ctx.lineTo(-4, 0); ctx.lineTo(-9, 11); ctx.closePath();
      ctx.fillStyle = C.lime; ctx.fill(); ctx.lineWidth = 3; ctx.lineJoin = 'round'; ctx.strokeStyle = C.ink; ctx.stroke();
      ctx.restore();
    }
  }

  /* screen space: snow, flash, joystick */
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = 'rgba(255,255,255,.85)';
  for (const f of flakes) { ctx.beginPath(); ctx.arc(f.x * W, f.y * H, f.r, 0, TAU); ctx.fill(); }
  if (flash > 0) { ctx.fillStyle = 'rgba(255,248,214,' + (flash * .5) + ')'; ctx.fillRect(0, 0, W, H); }
  if (mode === 'play') {
    if (jp !== null) {
      ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(255,255,255,.75)'; ctx.fillStyle = 'rgba(22,42,64,.18)';
      ctx.beginPath(); ctx.arc(jo.x, jo.y, JR, 0, TAU); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.arc(jo.x + jv.x * JR, jo.y + jv.y * JR, 24, 0, TAU); ctx.fillStyle = 'rgba(255,255,255,.8)'; ctx.fill();
    } else if (playT < 15) {
      const ix = W / 2, iy = H - 150;
      ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.setLineDash([8, 7]);
      ctx.beginPath(); ctx.arc(ix, iy, JR, 0, TAU); ctx.stroke(); ctx.setLineDash([]);
      ctx.beginPath(); ctx.arc(ix, iy, 22, 0, TAU); ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.fill();
    }
  }
}

/* ---------- HUD ---------- */
const el = { wood: $('wood'), meat: $('meat'), axes: $('axes'), folk: $('folk'), hint: $('hint') };
const cache = {};
function setT(k, v) { if (cache[k] !== v) { cache[k] = v; el[k].textContent = v; } }
function hud() {
  setT('wood', String(S.wood)); setT('meat', String(S.meat)); setT('axes', String(axeCount()));
  setT('folk', String(residents.length)); setT('hint', hintInfo.text);
}

/* ---------- boot ---------- */
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  W = cv.clientWidth || window.innerWidth; H = cv.clientHeight || window.innerHeight;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  zoom = Math.min(W / 480, H / 760);
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 150));

let last = performance.now();
function frame(ts) {
  const dt = Math.min(.05, Math.max(0, (ts - last) / 1000));
  last = ts;
  update(dt); render(); if (mode === 'play') hud();
  requestAnimationFrame(frame);
}

makeDrifts();
resize();
const hasSave = resetWorld(true);
if (hasSave) { $('play').textContent = 'Продолжить'; $('fresh').hidden = false; }

function startGame() {
  initAudio();
  mode = 'play'; playT = 0;
  $('start').hidden = true; $('hud').hidden = false;
  hud();
}
$('play').addEventListener('click', startGame);
$('fresh').addEventListener('click', () => { clearSave(); resetWorld(false); startGame(); });
$('snd').addEventListener('click', () => { muted = !muted; $('snd').textContent = muted ? 'Звук: выкл' : 'Звук: вкл'; initAudio(); });
document.addEventListener('visibilitychange', () => { last = performance.now(); if (document.hidden && mode === 'play') save(); });

requestAnimationFrame(frame);
})();
</script>

</body>
</html>
